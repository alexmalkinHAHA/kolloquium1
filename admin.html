<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Админ-панель — Коллоквиум 1</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="demoBanner" class="demo-banner" hidden>
  ДЕМО-РЕЖИМ: показаны только данные из этого браузера. Пароль администратора в демо-режиме: <b>demo</b>.
</div>

<header class="topbar">
  <h1>Преподаватель · результаты отработки</h1>
  <a class="admin-link" href="index.html">← на сайт для студентов</a>
</header>

<main class="wrap" style="max-width: 1100px;">

  <section id="screen-signin" class="screen">
    <div class="card" style="max-width:420px;">
      <h2>Вход</h2>
      <form id="signinForm">
        <label>Email
          <input type="text" id="aEmail" autocomplete="username" placeholder="teacher@example.com" />
        </label>
        <label>Пароль
          <input type="text" id="aPass" autocomplete="current-password" />
        </label>
        <button class="btn-primary" type="submit">Войти</button>
      </form>
      <p id="signinError" class="muted" style="color:var(--bad);"></p>
    </div>
  </section>

  <section id="screen-data" class="screen" hidden>
    <div class="stat-row" id="statRow"></div>

    <div class="filters">
      <input type="text" id="fSearch" placeholder="Поиск: ФИО, логин, группа…" />
      <select id="fTask">
        <option value="">Все задачи</option>
        <option value="t1">Задача 1 (Тема 2)</option>
        <option value="t2">Задача 2 (Тема 3)</option>
        <option value="t3">Задача 3 (Тема 4)</option>
        <option value="t4">Задача 4 (Тема 5)</option>
        <option value="t5">Задача 5 (Тема 5)</option>
        <option value="t6">Задача 6 (Тема 6)</option>
      </select>
      <select id="fStatus">
        <option value="">Любой статус</option>
        <option value="ok">Верно</option>
        <option value="no">Пока неверно</option>
      </select>
      <button class="btn-secondary" id="btnCsv">Скачать CSV</button>
      <button class="btn-secondary" id="btnRefresh">Обновить</button>
    </div>

    <div class="table-wrap">
      <table class="admin-table" id="dataTable">
        <thead>
          <tr>
            <th>ФИО</th><th>Группа</th><th>Логин</th><th>Задача</th><th>ID задачи</th>
            <th>Попыток</th><th>Статус</th><th>Фото</th><th>Обновлено</th>
          </tr>
        </thead>
        <tbody id="dataBody"></tbody>
      </table>
    </div>
  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="admin.js"></script>
</body>
</html>
